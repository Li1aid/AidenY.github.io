<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="lineH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1f1f2c" stroke-width="1" opacity="0.5">
    <path d="M0 150 H800 M0 300 H800"/>
    <path d="M200 0 V450 M400 0 V450 M600 0 V450"/>
  </g>

  <!-- ─── Sources ─── -->
  <g filter="url(#glow)">
    <rect x="50" y="80" width="190" height="60" rx="8" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="145" y="106" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="11">PubMed × 2 routes</text>
    <text x="145" y="124" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">WHITELIST + GUIDELINES</text>
  </g>
  <g filter="url(#glow)">
    <rect x="50" y="290" width="190" height="60" rx="8" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="145" y="316" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="11">26 sources</text>
    <text x="145" y="334" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">RSS · SITEMAP · WHO · FIGO</text>
  </g>

  <!-- ─── Claude grader ─── -->
  <g filter="url(#glow)">
    <rect x="320" y="185" width="170" height="70" rx="8" fill="#16161e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="405" y="214" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="12">Claude</text>
    <text x="405" y="234" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">GRADE A·B·C · READING CARD</text>
  </g>

  <!-- ─── Dashboard card mock ─── -->
  <g filter="url(#glow)">
    <rect x="570" y="140" width="190" height="160" rx="12" fill="#16161e" stroke="#888" stroke-width="1.2"/>
    <rect x="588" y="158" width="26" height="26" rx="6" fill="#101018" stroke="#4ade80" stroke-width="1.3"/>
    <text x="601" y="176" text-anchor="middle" fill="#4ade80" font-family="ui-monospace, monospace" font-size="13" font-weight="700">A</text>
    <rect x="626" y="160" width="118" height="8" rx="4" fill="#33333f"/>
    <rect x="626" y="174" width="90" height="8" rx="4" fill="#26262f"/>
    <rect x="588" y="200" width="156" height="7" rx="3.5" fill="#26262f"/>
    <rect x="588" y="214" width="156" height="7" rx="3.5" fill="#26262f"/>
    <rect x="588" y="228" width="122" height="7" rx="3.5" fill="#26262f"/>
    <rect x="588" y="250" width="66" height="16" rx="8" fill="#101018" stroke="#555" stroke-width="1"/>
    <rect x="662" y="250" width="66" height="16" rx="8" fill="#101018" stroke="#555" stroke-width="1"/>
    <text x="621" y="261" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8">核心问题</text>
    <text x="695" y="261" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8">局限性</text>
  </g>
  <text x="582" y="128" fill="#888" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.15em">DAILY DASHBOARD · 4 TABS</text>

  <!-- flow lines -->
  <path d="M240 110 L320 200" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M240 320 L320 240" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M490 220 L570 220" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>

  <!-- pulse -->
  <circle r="3.5" fill="#ffffff">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M240 110 L320 200 M240 320 L320 240 M490 220 L570 220"/>
    <animate attributeName="opacity"
      keyTimes="0; 0.03; 0.30; 0.33; 0.34; 0.63; 0.66; 0.67; 0.97; 1"
      values=  "0;  1;    1;    0;    1;    1;    0;    1;    1;    0"
      dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer label -->
  <text x="40" y="430" fill="#666" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="0.15em">PYTHON STDLIB · CLAUDE · BUILT FOR ONE RESEARCHER</text>
</svg>
