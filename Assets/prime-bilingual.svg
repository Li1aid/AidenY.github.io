    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00a8e1" stop-opacity="0.2"/><stop offset="1" stop-color="#00a8e1" stop-opacity="0"/></radialGradient>
    <linearGradient id="screenLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7fa"/><stop offset="1" stop-color="#ececf1"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset="1" stop-color="#15151c"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#000" flood-opacity="0.6"/></filter>
