<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="lineH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1f1f2c" stroke-width="1" opacity="0.5">
    <path d="M0 150 H800 M0 300 H800"/>
    <path d="M200 0 V450 M400 0 V450 M600 0 V450"/>
  </g>

  <!-- ─── Player frame with bilingual overlay ─── -->
  <g filter="url(#glow)">
    <rect x="140" y="48" width="520" height="220" rx="12" fill="#0d0d16" stroke="#888" stroke-width="1.2"/>
    <!-- play control bar -->
    <line x1="170" y1="238" x2="630" y2="238" stroke="#33333f" stroke-width="3"/>
    <line x1="170" y1="238" x2="380" y2="238" stroke="#e6e6ec" stroke-width="3"/>
    <circle cx="380" cy="238" r="5" fill="#ffffff"/>
    <!-- subtitles: EN on top, ZH below (the product) -->
    <text x="400" y="176" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="17" letter-spacing="0.02em">You can't outrun your past.</text>
    <text x="400" y="202" text-anchor="middle" fill="#ffe27a" font-family="ui-monospace, monospace" font-size="15">你逃不开你的过去。</text>
  </g>
  <text x="152" y="38" fill="#888" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.15em">PRIME VIDEO · OFFICIAL PLAYER · UNTOUCHED</text>

  <!-- ─── Pipeline nodes ─── -->
  <g filter="url(#glow)">
    <rect x="60" y="330" width="180" height="60" rx="8" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="150" y="356" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="11">TTML stream</text>
    <text x="150" y="374" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8.5" letter-spacing="0.12em">FETCH · XHR HOOK</text>
  </g>
  <g filter="url(#glow)">
    <rect x="310" y="330" width="180" height="60" rx="8" fill="#16161e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="400" y="356" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="11">Claude Haiku</text>
    <text x="400" y="374" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8.5" letter-spacing="0.12em">25-LINE BATCHES</text>
  </g>
  <g filter="url(#glow)">
    <rect x="560" y="330" width="180" height="60" rx="8" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="650" y="356" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="11">Overlay render</text>
    <text x="650" y="374" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8.5" letter-spacing="0.12em">EN / 中 · SYNCED</text>
  </g>

  <!-- flow lines -->
  <path d="M240 360 L310 360" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M490 360 L560 360" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M650 330 L620 268" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M150 330 L175 268" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>

  <!-- pulse along the pipeline -->
  <circle r="3.5" fill="#ffe27a">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M175 268 L150 330 M240 360 L310 360 M490 360 L560 360 M650 330 L620 268"/>
    <animate attributeName="opacity"
      keyTimes="0; 0.02; 0.23; 0.25; 0.26; 0.48; 0.50; 0.51; 0.73; 0.75; 0.76; 0.98; 1"
      values=  "0;  1;    1;    0;    1;    1;    0;    1;    1;    0;    1;    1;    0"
      dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer label -->
  <text x="40" y="430" fill="#666" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="0.15em">CHROME MV3 · ZERO DEPENDENCIES · PERSONAL BUILD</text>
</svg>
