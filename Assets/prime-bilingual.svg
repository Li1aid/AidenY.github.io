    <text x="800" y="170" fill="#f5f5f7" font-size="84" font-weight="700" letter-spacing="-3.5">Two languages.</text>
    <text x="800" y="262" fill="#f5f5f7" font-size="84" font-weight="700" letter-spacing="-3.5">One screen.</text>
    <text x="800" y="320" fill="#86868b" font-size="28" font-weight="400" letter-spacing="-0.2">Prime Bilingual — subtitles on Prime Video, translated as you watch.</text>
  </g>
