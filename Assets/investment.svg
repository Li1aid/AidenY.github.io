<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- Coordinate plan:
       Boundary box (dashed)  x=390..770  y=180..520
       Inside boundary (= MY LAPTOP):
         FLASK    rect 440,260  160x80   centre (520,300)
         DB       rect 640,260  100x60   centre (690,290)
         LAUNCHD  rect 440,420  160x50
       Outside boundary:
         ME       circle (90,300) r=44   right edge x=134
         TUNNEL   rect 200,272 130x56    centre (265,300)
         UPSTRM   rect 440,90  280x60    centre (580,120)
  -->
  <defs>
    <linearGradient id="invBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <filter id="invGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#invBg)"/>

  <!-- grid -->
  <g stroke="#1f1f2c" stroke-width="1" opacity="0.35">
    <path d="M0 200 H800 M0 400 H800"/>
    <path d="M200 0 V600 M400 0 V600 M600 0 V600"/>
  </g>

  <!-- ─── BOUNDARY: "my laptop" ─── -->
  <rect x="390" y="180" width="380" height="340" rx="14"
        fill="#4ade80" fill-opacity="0.04"
        stroke="#4ade80" stroke-width="1.3" stroke-dasharray="6 6" stroke-opacity="0.55"/>
  <!-- boundary tag (top-left of the box) -->
  <rect x="402" y="170" width="240" height="22" rx="4" fill="#16161e" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1"/>
  <text x="412" y="185" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.18em">MY LAPTOP · DATA NEVER LEAVES</text>

  <!-- ─── Lines (solid, edge-to-edge) ─── -->
  <!-- ME → TUNNEL -->
  <line x1="134" y1="300" x2="200" y2="300" stroke="#aaa" stroke-width="1.6" stroke-opacity="0.7"/>
  <!-- TUNNEL → FLASK (crosses the boundary) -->
  <line x1="330" y1="300" x2="440" y2="300" stroke="#4ade80" stroke-width="2" stroke-opacity="0.9"/>
  <!-- FLASK → DB (inside boundary) -->
  <line x1="600" y1="290" x2="640" y2="290" stroke="#4ade80" stroke-width="2" stroke-opacity="0.9"/>
  <!-- UPSTREAMS → FLASK (one-way pull, top-down, crosses boundary) -->
  <line x1="520" y1="150" x2="520" y2="260" stroke="#ffb84d" stroke-width="2" stroke-opacity="0.85"/>
  <!-- LAUNCHD → FLASK (dashed, inside boundary) -->
  <line x1="520" y1="420" x2="520" y2="340" stroke="#4ade80" stroke-width="1.6" stroke-dasharray="5 5" stroke-opacity="0.55"/>

  <!-- arrowheads -->
  <g fill="#4ade80">
    <polygon points="440,300 432,295 432,305" opacity="0.9"/>
    <polygon points="640,290 632,285 632,295" opacity="0.9"/>
    <polygon points="520,340 515,332 525,332" opacity="0.55"/>
  </g>
  <polygon points="520,260 515,250 525,250" fill="#ffb84d" opacity="0.85"/>
  <polygon points="200,300 192,295 192,305" fill="#aaa" opacity="0.7"/>

  <!-- ─── Nodes ─── -->

  <!-- ME -->
  <g filter="url(#invGlow)">
    <circle cx="90" cy="300" r="44" fill="#16161e" stroke="#aaa" stroke-width="1.3"/>
    <text x="90" y="296" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="12" letter-spacing="0.12em">ME</text>
    <text x="90" y="312" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.12em">PHONE</text>
  </g>

  <!-- TUNNEL (the gate) -->
  <g filter="url(#invGlow)">
    <rect x="200" y="272" width="130" height="56" rx="8" fill="#16161e" stroke="#4ade80" stroke-width="1.5"/>
    <text x="265" y="295" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="12">CF Tunnel</text>
    <text x="265" y="312" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">ACCESS · SSO LOGIN</text>
  </g>

  <!-- gate icon at boundary edge (between Tunnel and Flask) -->
  <g>
    <line x1="390" y1="285" x2="390" y2="315" stroke="#4ade80" stroke-width="2" stroke-opacity="0.6"/>
    <text x="383" y="278" fill="#4ade80" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em" text-anchor="end">gate</text>
  </g>

  <!-- UPSTREAMS -->
  <g filter="url(#invGlow)">
    <rect x="440" y="90" width="280" height="60" rx="8" fill="#16161e" stroke="#ffb84d" stroke-width="1"/>
    <text x="580" y="116" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="11">akshare · yfinance · Anthropic</text>
    <text x="580" y="134" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">EXTERNAL · READ-ONLY PULL</text>
  </g>

  <!-- FLASK (inside boundary) -->
  <g filter="url(#invGlow)">
    <rect x="440" y="260" width="160" height="80" rx="10" fill="#16161e" stroke="#6c8aff" stroke-width="1.5"/>
    <text x="520" y="290" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="12">Flask</text>
    <text x="520" y="306" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.1em">127.0.0.1:5180</text>
    <text x="520" y="324" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="9">api · services · views</text>
  </g>

  <!-- DB (inside boundary) -->
  <g filter="url(#invGlow)">
    <rect x="640" y="260" width="100" height="60" rx="8" fill="#16161e" stroke="#6c8aff" stroke-width="1"/>
    <text x="690" y="284" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="11">portfolio.db</text>
    <text x="690" y="302" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">SQLITE · WAL</text>
  </g>

  <!-- LAUNCHD (inside boundary) -->
  <g filter="url(#invGlow)">
    <rect x="440" y="420" width="160" height="50" rx="8" fill="#16161e" stroke="#6c8aff" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="520" y="442" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="11">launchd × 6</text>
    <text x="520" y="458" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">SCHEDULED · LOCAL</text>
  </g>

  <!-- ─── Pulses ─── -->
  <!-- request: ME → TUNNEL → FLASK -->
  <circle r="3" fill="#4ade80">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s"
      path="M134 300 L200 300"/>
    <animate attributeName="opacity" keyTimes="0;0.06;0.94;1" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#4ade80">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0.5s"
      path="M330 300 L440 300"/>
    <animate attributeName="opacity" keyTimes="0;0.06;0.94;1" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="3" fill="#4ade80">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1.2s"
      path="M600 290 L640 290"/>
    <animate attributeName="opacity" keyTimes="0;0.06;0.94;1" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <!-- external pull -->
  <circle r="3" fill="#ffb84d">
    <animateMotion dur="4s" repeatCount="indefinite" begin="2s"
      path="M520 150 L520 260"/>
    <animate attributeName="opacity" keyTimes="0;0.06;0.94;1" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <text x="60" y="555" fill="#666" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.15em">LOCAL · TUNNELED · PRIVATE</text>
</svg>
