<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="lineH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1f1f2c" stroke-width="1" opacity="0.5">
    <path d="M0 150 H800 M0 300 H800"/>
    <path d="M200 0 V450 M400 0 V450 M600 0 V450"/>
  </g>

  <!-- ─── Input sentence ─── -->
  <g filter="url(#glow)">
    <rect x="50" y="70" width="250" height="56" rx="10" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="70" y="98" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="14">今天的事就到此为止吧。</text>
    <text x="70" y="115" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.12em">CHINESE IN</text>
  </g>

  <!-- ─── Claude ─── -->
  <g filter="url(#glow)">
    <rect x="360" y="68" width="150" height="60" rx="8" fill="#16161e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="435" y="94" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="12">Claude</text>
    <text x="435" y="112" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">TRANSLATE · EXTRACT</text>
  </g>

  <!-- ─── Natural English out ─── -->
  <g filter="url(#glow)">
    <rect x="570" y="70" width="190" height="56" rx="10" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="590" y="98" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="13">Let's call it a day.</text>
    <text x="590" y="115" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.12em">NATURAL ENGLISH</text>
  </g>

  <!-- ─── Extracted chunk chip ─── -->
  <g filter="url(#glow)">
    <rect x="330" y="195" width="210" height="40" rx="20" fill="#101018" stroke="#ffffff" stroke-width="1.3"/>
    <text x="435" y="220" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13">call it a day</text>
  </g>
  <text x="560" y="220" fill="#888" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.12em">1–4 CHUNKS</text>

  <!-- ─── Flashcard ─── -->
  <g filter="url(#glow)">
    <rect x="330" y="290" width="220" height="100" rx="12" fill="#16161e" stroke="#888" stroke-width="1.2"/>
    <text x="440" y="330" text-anchor="middle" fill="#e6e6ec" font-family="ui-monospace, monospace" font-size="14">call it a day</text>
    <line x1="355" y1="345" x2="525" y2="345" stroke="#33333f" stroke-width="1"/>
    <text x="440" y="368" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="11">到此为止；收工</text>
  </g>

  <!-- ─── SRS node ─── -->
  <g filter="url(#glow)">
    <rect x="620" y="305" width="140" height="70" rx="8" fill="#16161e" stroke="#888" stroke-width="1"/>
    <text x="690" y="335" text-anchor="middle" fill="#aaa" font-family="ui-monospace, monospace" font-size="12">SRS</text>
    <text x="690" y="355" text-anchor="middle" fill="#888" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">SM-2 · FSRS</text>
  </g>

  <!-- flow lines -->
  <path d="M300 98 L360 98" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M510 98 L570 98" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M435 128 L435 195" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M435 235 L438 290" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>
  <path d="M550 345 L620 342" stroke="url(#lineH)" stroke-width="1.5" fill="none"/>

  <!-- pulse -->
  <circle r="3.5" fill="#ffffff">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M300 98 L360 98 M510 98 L570 98 M435 128 L435 195 M435 235 L438 290 M550 345 L620 342"/>
    <animate attributeName="opacity"
      keyTimes="0; 0.02; 0.18; 0.20; 0.21; 0.38; 0.40; 0.41; 0.58; 0.60; 0.61; 0.78; 0.80; 0.81; 0.98; 1"
      values=  "0;  1;    1;    0;    1;    1;    0;    1;    1;    0;    1;    1;    0;    1;    1;    0"
      dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer label -->
  <text x="40" y="430" fill="#666" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="0.15em">PWA IN DAILY USE · iOS IN PROGRESS · CF WORKER + D1</text>
</svg>
